quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:yourmenu}
quarkus.datasource.password=${DB_PASSWORD:yourmenu}

%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=postgres:16-alpine
%dev.quarkus.datasource.devservices.db-name=yourmenu_db

%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/yourmenu_db}

%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true

%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.log.sql=false

%dev.quarkus.hibernate-orm.sql-load-script=import.sql

smallrye.jwt.sign.key.location=privateKey.pem

mp.jwt.verify.publickey.location=publicKey.pem

mp.jwt.verify.issuer=comandas-api

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Sistema de Comandas API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST para gerenciamento de comandas de bar/restaurante

quarkus.http.port=8080

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
